name: superapp-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Bootstrap, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Activate Melos
        run: dart pub global activate melos
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Analyze workspace
        run: melos analyze
      - name: Test workspace
        run: melos test

  integration:
    name: Integration and release build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Activate Melos
        run: dart pub global activate melos
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Build development hosts
        run: melos run build:dev-hosts
      - name: Build production shell
        run: melos run build:consumer
